<!DOCTYPE html>
<html>
<head>
    <title>Отметка посещаемости</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary px-3">
        <a href="/teacher" class="navbar-brand">&larr; Назад</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Выйти</a>
    </nav>
    <div class="container mt-4">
        <h4>Отметка посещаемости</h4>
        <form method="POST">
            <table class="table table-bordered mt-3">
                <tr><th>Ученик</th><th>Статус</th></tr>
                {% for student in students %}
                <tr>
                    <td>{{ student[1] }}</td>
                    <td>
                        <input type="radio" name="student_{{ student[0] }}" value="Был" {% if existing.get(student[0]) == 'Был' %}checked{% endif %} required> Был
                        <input type="radio" name="student_{{ student[0] }}" value="Н" {% if existing.get(student[0]) == 'Н' %}checked{% endif %}> Не был
                    </td>
                </tr>
                {% endfor %}
            </table>
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
    </div>
</body>
</html>
