<!DOCTYPE html>
<html>
<head>
    <title>Вход - ШколоПосещаемость</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="text-center mb-4">ШколоПосещаемость</h3>
                        <form method="POST">
                            <div class="mb-3">
                                <label>Логин</label>
                                <input type="text" name="login" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Пароль</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Войти</button>
                        </form>
                        <hr>
                        <small class="text-muted d-block">Тестовые аккаунты (пароль 123):</small>
                        <small class="text-muted d-block">Учитель: teacher</small>
                        <small class="text-muted d-block">Родитель: parent</small>
                        <small class="text-muted d-block">Завуч: admin</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
