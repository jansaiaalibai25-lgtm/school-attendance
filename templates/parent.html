<!DOCTYPE html>
<html>
<head>
    <title>Успеваемость ребенка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary px-3">
        <span class="navbar-brand">Пропуски: Сидоров Алексей</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Выйти</a>
    </nav>
    <div class="container mt-4">
        <table class="table table-bordered mt-3">
            <tr><th>Дата</th><th>Предмет</th><th>Статус</th></tr>
            {% for row in records %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>
                    {% if row[2] == 'Н' %}
                        <span class="badge bg-danger">Пропуск</span>
                    {% else %}
                        <span class="badge bg-success">Был</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
